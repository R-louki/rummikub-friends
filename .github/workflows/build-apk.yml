name: Build and Test Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Rummikub APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Rummikub-Friends-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Run Unit Tests (Rules, Audio Ducking, Network)
        working-directory: ./android
        run: gradle :core-model:test :core-engine:test :core-network:test :core-audio:test --no-daemon
