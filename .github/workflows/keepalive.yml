name: Keep the game server awake

# The free Render instance falls asleep after ~15 min without traffic and takes ~50 s to wake up.
# This light request every 10 minutes keeps it awake (one 24/7 service fits in Render's free hours).
# GitHub disables scheduled workflows after 60 days without repository activity: push anything to re-enable.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        run: curl -fsS --max-time 90 https://rummikub-friends.onrender.com/ || echo "Server did not answer (it may be waking up)"
