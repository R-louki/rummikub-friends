name: Publish a release

# Push a tag such as v1.3.1 to build the signed APK and publish it on GitHub Releases.
# The app checks that page for updates, and the stable link
#   https://github.com/R-louki/rummikub-friends/releases/latest/download/Rummikub-Friends.apk
# always points to the newest APK (the server's /download page redirects to it).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

      # A release must be signed with the real key, otherwise installed apps could not be updated.
      - name: Restore the release keystore (required)
        env:
          KEYSTORE_B64: ${{ secrets.RUMMIKUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret RUMMIKUB_KEYSTORE_BASE64 is missing: refusing to publish an APK signed with the debug key."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/rummikub-release.jks
          echo "RUMMIKUB_KEYSTORE_FILE=keystore/rummikub-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: ./android
        env:
          RUMMIKUB_KEYSTORE_PASSWORD: ${{ secrets.RUMMIKUB_KEYSTORE_PASSWORD }}
          RUMMIKUB_KEY_ALIAS: ${{ secrets.RUMMIKUB_KEY_ALIAS }}
          RUMMIKUB_KEY_PASSWORD: ${{ secrets.RUMMIKUB_KEY_PASSWORD }}
        run: gradle :app:assembleDirectRelease --no-daemon

      - name: Name the APK for the stable download link
        run: cp android/app/build/outputs/apk/direct/release/app-direct-release.apk Rummikub-Friends.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: Rummikub-Friends.apk
          generate_release_notes: true
