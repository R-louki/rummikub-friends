# Configuration of the Rummikub app (not secret: these values end up in the APK anyway).
#
# googleWebClientId: the OAuth client ID of type "Web application" created in Google Cloud Console
#   (APIs & Services > Credentials). The same ID must be listed in Supabase under
#   Authentication > Providers > Google. Leave it EMPTY to play without accounts (anonymous mode).
googleWebClientId=
